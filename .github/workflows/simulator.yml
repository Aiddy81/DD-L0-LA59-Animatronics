name: Simulator

on:
  pull_request:
  push:
    branches: [main, dev, Documentation]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  firmware:
    name: code.py headless (CircuitPython strict)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.13"
      - name: Run code.py against the simulator's hardware stand-ins
        run: python simulator/tests/headless.py
      - name: Drop-in shims (dist\shims\) override and add to the built-ins
        run: python simulator/tests/shim_dir.py

  build:
    name: Simulator build (Windows exe)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the dev image
        run: docker build -t ddl0-sim-dev simulator/docker
      - name: Restore cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .ci-cache/registry
            .ci-cache/target
          key: sim-${{ runner.os }}-${{ hashFiles('simulator/Cargo.lock', 'simulator/docker/Dockerfile') }}
          restore-keys: sim-${{ runner.os }}-
      - name: Format, lint, build and build the unit tests
        run: |
          mkdir -p .ci-cache/registry .ci-cache/target
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/registry:/usr/local/cargo/registry" \
            -v "$PWD/.ci-cache/target:/target" \
            -e CARGO_TARGET_DIR=/target -e CHECK=1 -e LOCKED=1 -e TEST=1 \
            -w /workspace/simulator ddl0-sim-dev bash docker/build.sh
          sudo chown -R "$(id -u):$(id -g)" .ci-cache simulator/dist
      - name: Upload the simulator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ddl0-sim-windows
          path: simulator/dist/
          retention-days: 14

  # Native Linux build in the same image. The unit tests run inside it, so
  # there's no separate Linux test job.
  build-linux:
    name: Simulator build and unit tests (Linux)
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Build the dev image
        run: docker build -t ddl0-sim-dev simulator/docker
      - name: Restore cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            .ci-cache/registry
            .ci-cache/target
          key: sim-linux-${{ runner.os }}-${{ hashFiles('simulator/Cargo.lock', 'simulator/docker/Dockerfile') }}
          restore-keys: sim-linux-${{ runner.os }}-
      - name: Format, lint, build and run the unit tests
        run: |
          mkdir -p .ci-cache/registry .ci-cache/target
          docker run --rm \
            -v "$PWD:/workspace" \
            -v "$PWD/.ci-cache/registry:/usr/local/cargo/registry" \
            -v "$PWD/.ci-cache/target:/target" \
            -e CARGO_TARGET_DIR=/target -e PLATFORM=linux -e CHECK=1 -e LOCKED=1 -e TEST=1 \
            -e "OWNER=$(id -u):$(id -g)" \
            -w /workspace/simulator ddl0-sim-dev bash docker/build.sh
          sudo chown -R "$(id -u):$(id -g)" .ci-cache
      - name: Upload the simulator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ddl0-sim-linux
          path: simulator/dist/
          retention-days: 14

  # Native Apple Silicon build on a macOS runner (no Docker there), with the
  # same docker/build.sh. The unit tests run inside it, as on Linux.
  build-macos:
    name: Simulator build and unit tests (macOS arm64)
    runs-on: macos-14
    timeout-minutes: 60
    env:
      RUSTUP_TOOLCHAIN: 1.92.0
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: Install Rust 1.92 (rustup is on the runner)
        run: |
          rustup toolchain install "$RUSTUP_TOOLCHAIN" --profile minimal -c rustfmt,clippy
          rustc --version
      - name: Fetch the bundled Python (SHA-256 checked)
        run: bash simulator/docker/fetch-python-macos.sh "$RUNNER_TEMP/pbs"
      - name: Restore cargo cache
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: |
            ~/.cargo/registry
            .ci-cache/target
          key: sim-macos-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('simulator/Cargo.lock', 'simulator/docker/fetch-python-macos.sh') }}
          restore-keys: sim-macos-${{ runner.os }}-${{ runner.arch }}-
      - name: Format, lint, build and run the unit tests
        working-directory: simulator
        run: |
          PLATFORM=macos PY_MACOS="$RUNNER_TEMP/pbs/python" CARGO_TARGET_DIR="$GITHUB_WORKSPACE/.ci-cache/target" \
            CHECK=1 LOCKED=1 TEST=1 bash docker/build.sh
      - name: Check the staged app starts its Python from dist/
        working-directory: simulator/dist
        run: |
          otool -L ddl0-sim | grep -F '@rpath/libpython3.13.dylib'
          otool -l ddl0-sim | grep -A2 LC_RPATH | grep -F '@executable_path/python/lib'
          codesign -v ddl0-sim python/lib/libpython3.13.dylib
      - name: Upload the simulator
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ddl0-sim-macos-arm64
          path: simulator/dist/
          retention-days: 14

  # The tests are a Windows exe (cross-compiled like the app), so they run on
  # Windows, from the built dist/ beside the Python and MinGW DLLs.
  unit-tests:
    name: Rust unit tests (Windows)
    needs: build
    runs-on: windows-latest
    timeout-minutes: 10
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddl0-sim-windows
          path: dist
      - name: Run the unit tests
        shell: pwsh
        working-directory: dist
        run: |
          .\ddl0-sim-tests.exe
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }

  # Packs every platform's build into the release archives on every run, so
  # packaging is tested on each PR rather than first tried on main. Needs
  # every check above, so a failing build or test never gets packaged.
  package:
    name: Package (release preview)
    needs: [firmware, build, unit-tests, build-linux, build-macos]
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddl0-sim-windows
          path: builds/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddl0-sim-linux
          path: builds/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddl0-sim-macos-arm64
          path: builds/macos-arm64
      - name: Package the simulator and firmware
        run: |
          for platform in windows linux macos-arm64; do
            bash simulator/release/package.sh "$platform" "dev-${GITHUB_SHA::7}" release-out "builds/$platform"
          done
      - name: Upload the release preview
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: ddl0-release-preview
          path: |
            release-out/*.zip
            release-out/*.tar.gz
            release-out/SHA256SUMS
          retention-days: 14

  # Every push to main (only reviewed merges move it) becomes a release. The
  # tag is chosen here, inside the concurrency group, so two quick merges
  # can't pick the same one.
  release:
    name: GitHub release
    needs: package
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddl0-sim-windows
          path: builds/windows
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddl0-sim-linux
          path: builds/linux
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: ddl0-sim-macos-arm64
          path: builds/macos-arm64
      - name: Choose the tag (vYYYY.MM.DD, then .2, .3 the same day)
        run: |
          base="v$(date -u +%Y.%m.%d)"
          taken=$(git ls-remote --tags --refs origin "refs/tags/$base*" | sed 's|.*refs/tags/||')
          tag=$base n=1
          while grep -qxF "$tag" <<<"$taken"; do n=$((n + 1)); tag="$base.$n"; done
          echo "TAG=$tag" >> "$GITHUB_ENV"
          echo "Releasing $tag"
      - name: Package the simulator and firmware
        run: |
          for platform in windows linux macos-arm64; do
            bash simulator/release/package.sh "$platform" "$TAG" release-out "builds/$platform"
          done
      - name: Write the release notes
        env:
          GITHUB_TOKEN: ${{ github.token }}
        run: python3 .github/scripts/release_notes.py --repo "$GITHUB_REPOSITORY" --tag "$TAG" --sums release-out/SHA256SUMS > notes.md
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$TAG" --target "$GITHUB_SHA" --title "DD-L0-LA59 $TAG" \
            --notes-file notes.md release-out/*.zip release-out/*.tar.gz release-out/SHA256SUMS
